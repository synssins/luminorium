# Development settings only. The add-on image installs luminorium_addon/requirements.txt.
[project]
name = "luminorium"
requires-python = ">=3.12"
dynamic = ["version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["luminorium_addon", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: long mapping scenarios (run with --slow)"]
# The mapping end-to-end runs record hundreds of MB of frames: keep them only when a test fails
tmp_path_retention_policy = "failed"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["luminorium_addon", "tests", "tools"]
extend-exclude = ["proto", ".venv", ".dev-data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
# Timeouts as parameters are deliberate in the HA client API
ignore = ["ASYNC109"]
